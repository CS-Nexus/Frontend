<div
  *ngIf="activeMember"
  [@memberAnimation]
  class="team__member flex gap-5 md:gap-12"
>
  <div class="member__image">
    <img [src]="activeMember.image" [alt]="activeMember.name" />
  </div>

  <div class="member__content">
    <div class="flex flex-col gap-2">
      <h2 class="member__name">{{ activeMember.name }}</h2>

      <p class="member__desc">{{ activeMember.description }}</p>
    </div>

    <div class="flex flex-col gap-2">
      <h3 class="part__header">Roles:</h3>
      <div class="member__badges">
        @for (role of activeMember.role; track $index) {
        <span>{{ role }}</span>
        }
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <h3 class="part__header">Tools Used:</h3>
      <div class="member__badges">
        @for (tool of activeMember.toolsUsed; track $index) {
        <span>{{ tool }}</span>
        }
      </div>
    </div>

    <div class="member__social flex flex-col gap-2">
      <h3 class="part__header">Follow Me:</h3>

      <div class="flex items-center gap-2">
        @for (social of activeMember.social; track $index) {
        <a [href]="social.link">
          <ng-icon [name]="social.icon"></ng-icon>
        </a>
        }
      </div>
    </div>
  </div>
</div>
